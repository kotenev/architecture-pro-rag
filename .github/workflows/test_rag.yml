name: Test RAG Pipeline (YandexGPT)

on:
  push:
    branches: [ "rag" ]
  pull_request:
    branches: [ "rag" ]
  workflow_dispatch:

jobs:
  test:
    name: Run pytest for RAG pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest yandex-cloud-ml-sdk sentence-transformers faiss-cpu

      - name: Prepare environment
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_LLM_MODEL: yandexgpt-5-lite
        run: |
          echo "Environment variables set."
          echo "Folder ID: $YANDEX_FOLDER_ID"
          echo "Model: $YANDEX_LLM_MODEL"

      - name: Run tests
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_LLM_MODEL: yandexgpt-lite
        run: |
          pytest -v tests/test_rag_pipeline.py --maxfail=1 --disable-warnings

      - name: Upload pytest report (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: .pytest_cache
